# Example configuration for local vLLM deployment
# Environment settings
environment:
  horizon: 10
  order: "boiled_egg"
  layout: "cramped_room"
  max_steps: 400

# Agent settings for local vLLM
agents:
  num_agents: 2
  agent_0:
    type: "vllm"  # Use local vLLM server
    model: "meta-llama/Llama-2-7b-chat-hf"  # Model name served by vLLM
    base_url: "http://localhost:8000/v1"  # vLLM server URL
    model_path: "/path/to/llama2-7b-chat"  # Local model path for tokenizer
    temperature: 0.1
    max_tokens: 512
    timeout: 60  # Longer timeout for local models
    max_retries: 3
    role: "Chef"
  agent_1:
    type: "vllm"
    model: "meta-llama/Llama-2-7b-chat-hf"
    base_url: "http://localhost:8000/v1"
    model_path: "/path/to/llama2-7b-chat"
    temperature: 0.1
    max_tokens: 512
    timeout: 60
    max_retries: 3
    role: "Assistant"

# Evaluation settings
evaluation:
  metrics:
    - "f1_score"
    - "similarity"
    - "collaboration_initiate"
  output_dir: "./results/vllm"
  save_trajectories: true

# Logging settings
logging:
  level: "INFO"
  save_logs: true
  log_dir: "./logs/vllm"